<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxInsight – Cổng Phát Hành Bản Quyền & Keygen Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 md:p-8">
    <div class="flex items-center space-x-3 mb-6">
      <div class="w-12 h-12 bg-teal-500/20 text-teal-400 rounded-xl flex items-center justify-center text-2xl font-bold border border-teal-500/30">
        🔑
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-wide">TaxInsight License Keygen</h1>
        <p class="text-xs text-slate-400">Trình phát hành mã kích hoạt bản quyền theo Mã máy (Machine ID)</p>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
          Mã máy của khách hàng (Machine ID) <span class="text-red-400">*</span>
        </label>
        <div class="relative">
          <input
            id="machineId"
            type="text"
            placeholder="Ví dụ: TR-8A2F-9D10-4B1C-E377"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-teal-300 font-mono focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all uppercase"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
          Tên khách hàng / Doanh nghiệp
        </label>
        <input
          id="customerName"
          type="text"
          placeholder="Ví dụ: Công ty TNHH Kế toán Minh Anh"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all"
        />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
            Gói bản quyền
          </label>
          <select
            id="tier"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all cursor-pointer"
            onchange="updateExpiryHelp()"
          >
            <option value="LIFETIME">⭐ Vĩnh viễn (LIFETIME)</option>
            <option value="PRO_1Y">💼 Chuyên nghiệp (1 Năm)</option>
            <option value="PERSONAL_1Y">👤 Cá nhân (1 Năm)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
            Hạn dùng đến ngày
          </label>
          <input
            id="expiryDate"
            type="date"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all"
            value="2099-12-31"
          />
        </div>
      </div>

      <button
        onclick="generateKey()"
        class="w-full mt-2 bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-teal-500/20 active:scale-[0.99] transition-all flex items-center justify-center space-x-2"
      >
        <span>⚡ Tạo Mã Kích Hoạt License Key</span>
      </button>

      <!-- Kết quả -->
      <div id="resultContainer" class="hidden mt-6 pt-5 border-t border-slate-700/80 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase text-emerald-400 flex items-center space-x-1.5">
            <span>✅ Đã tạo License Key thành công</span>
          </span>
          <button
            onclick="copyKey()"
            id="copyBtn"
            class="text-xs font-semibold bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-lg border border-emerald-500/30 transition-all flex items-center space-x-1"
          >
            <i class="fa-regular fa-copy"></i>
            <span>Sao chép Key</span>
          </button>
        </div>

        <div class="relative">
          <textarea
            id="outputKey"
            readonly
            rows="3"
            class="w-full bg-slate-950 border border-emerald-500/40 rounded-xl p-3 text-xs text-emerald-400 font-mono break-all focus:outline-none select-all"
          ></textarea>
        </div>

        <p class="text-[11px] text-slate-400 italic">
          💡 Hãy gửi toàn bộ chuỗi ký tự trên cho khách hàng để dán vào khung kích hoạt trên ứng dụng TaxInsight.
        </p>
      </div>
    </div>
  </div>

  <script>
    const SECRET_SIGN_KEY = 'TR_2026_MASTER_SECRET_KEY_TAXRECORD_VIETNAM_SECURE_AUTH';

    function updateExpiryHelp() {
      const tier = document.getElementById('tier').value;
      const expiryInput = document.getElementById('expiryDate');
      if (tier === 'LIFETIME') {
        expiryInput.value = '2099-12-31';
      } else {
        const nextYear = new Date();
        nextYear.setFullYear(nextYear.getFullYear() + 1);
        expiryInput.value = nextYear.toISOString().split('T')[0];
      }
    }

    function generateKey() {
      const machineId = document.getElementById('machineId').value.trim().toUpperCase();
      const customerName = document.getElementById('customerName').value.trim() || 'Khách hàng TaxInsight';
      const tier = document.getElementById('tier').value;
      const expiryDate = document.getElementById('expiryDate').value || '2099-12-31';

      if (!machineId) {
        alert('Vui lòng nhập Mã máy (Machine ID) của khách hàng!');
        document.getElementById('machineId').focus();
        return;
      }

      const issuedAt = new Date().toISOString();
      const dataToSign = `${machineId}|${customerName}|${tier}|${expiryDate}|${issuedAt}`;
      
      const signature = CryptoJS.HmacSHA256(dataToSign, SECRET_SIGN_KEY).toString(CryptoJS.enc.Hex).toUpperCase();

      const payload = {
        machineId,
        customerName,
        tier,
        expiryDate,
        issuedAt,
        signature
      };

      const jsonStr = JSON.stringify(payload);
      const base64Key = btoa(unescape(encodeURIComponent(jsonStr)));

      document.getElementById('outputKey').value = base64Key;
      document.getElementById('resultContainer').classList.remove('hidden');
    }

    function copyKey() {
      const keyText = document.getElementById('outputKey').value;
      navigator.clipboard.writeText(keyText).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Đã sao chép!</span>';
        btn.classList.add('bg-emerald-500/30');
        setTimeout(() => {
          btn.innerHTML = '<i class="fa-regular fa-copy"></i> <span>Sao chép Key</span>';
          btn.classList.remove('bg-emerald-500/30');
        }, 2000);
      });
    }
  </script>
</body>
</html>
