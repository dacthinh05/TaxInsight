 ```yaml
name: Release TaxInsight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build frontend and Electron main bundles
        run: npm run build

      - name: Package with electron-builder and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win -p always -c.directories.output=release

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: TaxInsight-Windows-Binaries
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn
 ```                                                                    
