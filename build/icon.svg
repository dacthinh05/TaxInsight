<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Canvas Gradient (Deep Obsidian Teal) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0F2D2A" />
      <stop offset="60%" stop-color="#071A19" />
      <stop offset="100%" stop-color="#030E0D" />
    </radialGradient>

    <!-- Metallic Specular Lighting on Squircle Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0D9488" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#042F2E" stop-opacity="0.8" />
    </linearGradient>

    <!-- Isometric Facet Gradients for 3D 'T' & 'I' Geometric Form -->
    <!-- Top Face (Bright Mint Cyan Highlight) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Left Face (Deep Emerald Teal) -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Right Face (Rich Dark Jade) -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Center Insight Core Beam (Glowing Energy Line) -->
    <linearGradient id="coreBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Deep Ambient Occlusion & Bloom Shadows -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="prismShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="36" stdDeviation="40" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 1. Background Rounded Squircle (Modern App Container) -->
  <rect x="36" y="36" width="952" height="952" rx="224" fill="url(#bgGrad)" />
  <rect x="36" y="36" width="952" height="952" rx="224" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Ambient Glow Behind Central Emblem -->
  <circle cx="512" cy="512" r="320" fill="#0D9488" opacity="0.18" filter="url(#coreGlow)" />

  <!-- 2. Central 3D Geometric Symbol: The 'TaxInsight' Monogram & Data Prism -->
  <!-- Monolithic architecture representing Precision, Structure & Insight -->
  <g filter="url(#prismShadow)">

    <!-- A. TOP BAR OF 'T' (Horizontal Floating Data Bar) -->
    <!-- Top polygon (Facet 1) -->
    <path d="M 276 312 L 512 176 L 748 312 L 512 448 Z" fill="url(#topFace)" />
    
    <!-- Left thickness of top bar -->
    <path d="M 276 312 L 512 448 L 512 524 L 276 388 Z" fill="url(#leftFace)" />
    
    <!-- Right thickness of top bar -->
    <path d="M 512 448 L 748 312 L 748 388 L 512 524 Z" fill="url(#rightFace)" />

    <!-- B. VERTICAL PILLAR OF 'T' (Depth & Stability) -->
    <!-- Left Pillar Facet -->
    <path d="M 432 500 L 512 546 L 512 840 L 432 794 Z" fill="url(#leftFace)" />
    <!-- Right Pillar Facet -->
    <path d="M 512 546 L 592 500 L 592 794 L 512 840 Z" fill="url(#rightFace)" />

    <!-- C. FLOATING 'INSIGHT' LENS / CORE PRISM ('I' Element) -->
    <!-- An inner floating diamond that completes the 'TI' monogram -->
    <g transform="translate(0, 18)">
      <!-- Upper diamond facet -->
      <path d="M 512 360 L 616 420 L 512 480 L 408 420 Z" fill="url(#coreBeam)" filter="url(#coreGlow)" />
      <!-- Left reflection facet -->
      <path d="M 408 420 L 512 480 L 512 548 L 408 488 Z" fill="#10B981" />
      <!-- Right reflection facet -->
      <path d="M 512 480 L 616 420 L 616 488 L 512 548 Z" fill="#047857" />
    </g>

    <!-- D. Precision Audit Dot (Apex Spark) -->
    <circle cx="512" cy="176" r="14" fill="#FFFFFF" opacity="0.9" />
    <circle cx="512" cy="448" r="8" fill="#FFFFFF" opacity="0.7" />
  </g>
</svg>